services:
  - type: web
    name: naver-keyword-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && (cd server && npx puppeteer browsers install chrome)
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NAVER_API_KEY
        sync: false
      - key: NAVER_SECRET_KEY
        sync: false
      - key: NAVER_CUSTOMER_ID
        sync: false
