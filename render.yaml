services:
  - type: web
    name: naver-keyword-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: NAVER_API_KEY
        sync: false
      - key: NAVER_SECRET_KEY
        sync: false
      - key: NAVER_CUSTOMER_ID
        sync: false
